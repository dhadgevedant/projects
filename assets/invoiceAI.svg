<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d10"/>
      <stop offset="100%" stop-color="#14161d"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Canvas Floor -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <!-- Outer Document Card -->
  <rect x="80" y="50" width="640" height="400" rx="0" fill="#181a20" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
  
  <!-- Header Bar -->
  <rect x="80" y="50" width="640" height="44" fill="#1f222a"/>
  <circle cx="110" cy="72" r="5" fill="#e05252"/>
  <circle cx="128" cy="72" r="5" fill="#e5a13c"/>
  <circle cx="146" cy="72" r="5" fill="#42b883"/>
  <text x="175" y="76" font-family="'Inter', sans-serif" font-size="12" fill="#88909e" letter-spacing="1">INVOICE_INTELLIGENCE // OCR &amp; OPENCV PARSER</text>
  
  <!-- Document Sheet -->
  <rect x="120" y="120" width="360" height="290" fill="#252932" stroke="rgba(255, 255, 255, 0.08)"/>
  
  <!-- Simulated Lines of Text in Document -->
  <rect x="150" y="150" width="120" height="12" fill="#444b58"/>
  <rect x="150" y="172" width="200" height="8" fill="#363c47"/>
  <rect x="150" y="186" width="180" height="8" fill="#363c47"/>
  
  <!-- OpenCV Bounding Boxes (Neon Detection Overlays) -->
  <!-- Box 1: Vendor -->
  <rect x="145" y="210" width="190" height="32" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="145" y="198" width="80" height="12" fill="#10b981"/>
  <text x="148" y="207" font-family="monospace" font-size="9" fill="#000" font-weight="bold">VENDOR_NAME</text>
  <rect x="155" y="220" width="140" height="12" fill="#ffffff" opacity="0.85"/>
  
  <!-- Box 2: Total Amount -->
  <rect x="145" y="270" width="210" height="42" fill="none" stroke="#ff9b12" stroke-width="1.5"/>
  <rect x="145" y="258" width="85" height="12" fill="#ff9b12"/>
  <text x="148" y="267" font-family="monospace" font-size="9" fill="#000" font-weight="bold">TOTAL_AMOUNT</text>
  <text x="155" y="298" font-family="'Inter', monospace" font-size="20" font-weight="600" fill="#ffffff">$4,850.00</text>
  
  <!-- Box 3: Tax & Date -->
  <rect x="145" y="335" width="150" height="26" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="145" y="325" width="55" height="10" fill="#60a5fa"/>
  <text x="148" y="333" font-family="monospace" font-size="8" fill="#000" font-weight="bold">DATE_STAMP</text>
  <text x="155" y="352" font-family="'Inter', monospace" font-size="11" fill="#cbd5e1">2024-03-18</text>
  
  <!-- Right Panel: Real-time LLM Extraction Stream -->
  <rect x="505" y="120" width="185" height="290" fill="#181a20" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="525" y="148" font-family="'Inter', sans-serif" font-size="11" fill="#9ca3af" font-weight="bold" letter-spacing="1">PARSED JSON</text>
  
  <text x="525" y="178" font-family="monospace" font-size="10" fill="#10b981">"vendor":</text>
  <text x="525" y="194" font-family="monospace" font-size="10" fill="#e2e8f0">  "Apex Dynamics"</text>
  
  <text x="525" y="222" font-family="monospace" font-size="10" fill="#ff9b12">"total":</text>
  <text x="525" y="238" font-family="monospace" font-size="10" fill="#e2e8f0">  4850.00 USD</text>
  
  <text x="525" y="266" font-family="monospace" font-size="10" fill="#60a5fa">"confidence":</text>
  <text x="525" y="282" font-family="monospace" font-size="10" fill="#e2e8f0">  0.984 (Ollama)</text>
  
  <rect x="525" y="340" width="145" height="36" rx="4" fill="#252932" stroke="rgba(255, 255, 255, 0.12)"/>
  <text x="545" y="362" font-family="'Inter', sans-serif" font-size="11" fill="#ffffff">LLM Chat Ready ●</text>
</svg>

